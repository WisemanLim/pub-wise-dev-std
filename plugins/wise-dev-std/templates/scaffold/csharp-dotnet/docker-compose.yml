# {{PROJECT_NAME}} — csharp-dotnet
# 주의: app 은 호스트 직접 실행 권장(dotnet run). 컨테이너화는 prod 멀티스테이지로 별도.
# 여기서는 datastore 인프라만 정의.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports: ["${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7.4-alpine
    ports: ["${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"]
  api:
    profiles: ["app"]
    build: { context: ., dockerfile: Dockerfile }
    env_file: [".env.${ENV:-dev}"]
    ports: ["${BIND_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"]
    depends_on: [postgres, redis]
volumes:
  pgdata:
