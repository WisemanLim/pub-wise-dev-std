id: java-spring
title: "Java (Spring Boot)"
status: stable
summary: >
  엔터프라이즈 표준 Java 백엔드. Spring Boot 3 + JPA + 검증된 생태계.
  ERP·금융·공공 시스템, 레거시 Java 연동, 대형 팀 협업에 적합.
when_to_use:
  - "Java 생태계·레거시 연동이 필수일 때"
  - "엔터프라이즈 ERP·금융·공공 백엔드"
  - "팀이 Java에 익숙하고 Spring 생태계(JPA, Security, Batch)가 필요할 때"
  - "대형 팀 협업 및 오랜 유지보수가 예상될 때"
avoid_when:
  - "새 서비스이고 팀이 Go/Node에 익숙 → go-gin / node-next-nest"
  - "ML/데이터 파이프라인 → python-fastapi"
  - "초고동시성·저지연 → rust-axum / go-gin"
  - "단일 바이너리 배포가 중요 → go-gin"

languages:
  primary: java
  also: []

package_managers:
  default: gradle
  allowed: [gradle, maven]
  notes: "Gradle Kotlin DSL (build.gradle.kts) 권장. Maven 도 허용. 빌드는 Makefile 로 추상화."

layers:
  frontend: null
  backend:
    framework: "Spring Boot 3 (Web MVC)"
    orm: "Spring Data JPA (Hibernate + PostgreSQL)"
    rpc: "gRPC (optional)"
  database:
    default: postgres
    local: h2
    cache: redis
  ops:
    ci: "GitHub Actions (or GitLab CI)"
    container: "Docker (multi-stage) + Docker Compose"
    deploy: "Kubernetes + Helm + Argo CD"
    quality: "Checkstyle + JUnit 5 + SonarQube"
  app: null

run_methods:
  direct:
    dev: "./gradlew bootRun --args='--spring.profiles.active=local'"
    start: "java -jar build/libs/*.jar"
    local_pm: "goreman (Procfile.dev) — make local-all/local-logs/local-stop/local-restart/local-ps. go install github.com/mattn/goreman@latest"
  container:
    dev: "docker compose up"

environments:
  local:   { db: h2,       compose: false, notes: "bootRun + H2 인메모리, 외부 의존 최소" }
  dev:     { db: postgres, compose: true,  notes: "compose: postgres+redis" }
  staging: { db: postgres, compose: true,  notes: "prod 동등 구성으로 검증" }
  prod:    { db: postgres, compose: false, notes: "K8s + Helm, multi-stage 이미지" }

scaffold:
  tree:
    - "src/main/java/com/example/app/"
    - "src/main/resources/"
    - "src/test/java/com/example/app/"
    - ".github/workflows/"
  files:
    - "Makefile"
    - "Procfile.dev"
    - "Dockerfile"
    - "docker-compose.yml"
    - "build.gradle.kts"
    - "settings.gradle.kts"
    - "gradle/wrapper/gradle-wrapper.properties"
    - "src/main/java/com/example/app/Application.java"
    - "src/main/resources/application.yml"
    - "src/main/resources/application-local.yml"
    - ".github/workflows/ci.yml"

testing:
  framework: "JUnit 5 (unit) + Spring Boot Test / MockMvc (통합)"
  dir: "test/"
  dev_env: "test/dev-env/"
  impl: "test/impl/<Nth>/"
  cycle: "시나리오→진행→오류시 수정·재시험→결과작성 / scenario→run→fix&retest→result"

makefile_targets:                 # 공통 진입점 — 모든 환경 동일 네이밍 (템플릿 Makefile 이 단일 기준)
  env_family: "<env>-all | -build(prod 제외) | -logs | -stop | -restart | -ps  (env = local|dev|staging|prod)"
  db: "db-migrate | db-seed | db-reset | db-fresh  [ENV=<env>]"
  common: "preflight | test | deploy | help"
  test: "./gradlew test"
  # build: "docker compose build"
  deploy: "helm upgrade / argocd sync"

references:
  - "Spring Boot 3.3 LTS, Spring Data JPA, Gradle 8, eclipse-temurin:21"
