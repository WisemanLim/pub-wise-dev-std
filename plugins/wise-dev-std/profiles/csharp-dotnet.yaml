id: csharp-dotnet
title: "C# (.NET / ASP.NET Core)"
status: stable
summary: >
  Windows/크로스플랫폼 엔터프라이즈 API. ASP.NET Core 8 Web API + EF Core ORM.
  레거시 .NET Framework 마이그레이션 및 ERP·MES·그룹웨어 백엔드에 적합.
when_to_use:
  - "Windows 환경 또는 .NET 생태계가 기존 인프라일 때"
  - "엔터프라이즈 ERP·MES·그룹웨어 백엔드"
  - "레거시 .NET Framework → .NET 8 마이그레이션"
  - "팀이 C#에 익숙하고 풍부한 NuGet 생태계가 필요할 때"
avoid_when:
  - "ML/데이터 파이프라인이 핵심 → python-fastapi"
  - "초고동시성·저지연 코어 → go-gin / rust-axum"
  - "프론트-백엔드 언어 통일이 목표 → node-next-nest"

languages:
  primary: csharp
  also: [dotnet]

package_managers:
  default: nuget
  allowed: [nuget]
  notes: "dotnet CLI (dotnet add package). 빌드는 Makefile 로 추상화."

layers:
  frontend: null
  backend:
    framework: "ASP.NET Core 8 Web API"
    orm: "Entity Framework Core 8 (Npgsql)"
    rpc: "gRPC (optional)"
  database:
    default: postgres
    local: sqlite
    cache: redis
  ops:
    ci: "GitHub Actions (or GitLab CI)"
    container: "Docker (multi-stage) + Docker Compose"
    deploy: "Kubernetes + Helm + Argo CD"
    quality: "dotnet-format + xUnit + SonarQube"
  app: null

run_methods:
  direct:
    dev: "dotnet run --project src/Api --launch-profile Development"
    start: "dotnet src/Api/bin/Release/net8.0/Api.dll"
    local_pm: "goreman (Procfile.dev) — make run/stop. go install github.com/mattn/goreman@latest"
  container:
    dev: "docker compose up"

environments:
  local:   { db: sqlite,   compose: false, notes: "dotnet run + SQLite, 외부 의존 최소" }
  dev:     { db: postgres, compose: true,  notes: "compose: postgres+redis" }
  staging: { db: postgres, compose: true,  notes: "prod 동등 구성으로 검증" }
  prod:    { db: postgres, compose: false, notes: "K8s + Helm, multi-stage 이미지" }

scaffold:
  tree:
    - "src/Api/"
    - "src/Core/"
    - "tests/Api.Tests/"
    - ".github/workflows/"
  files:
    - "Makefile"
    - "Procfile.dev"
    - "Dockerfile"
    - "docker-compose.yml"
    - "src/Api/Api.csproj"
    - "src/Api/Program.cs"
    - "src/Api/appsettings.json"
    - "src/Api/appsettings.Development.json"
    - ".env.local"
    - ".github/workflows/ci.yml"

testing:
  framework: "xUnit (unit) + WebApplicationFactory (통합)"
  dir: "test/"
  dev_env: "test/dev-env/"
  impl: "test/impl/<Nth>/"
  cycle: "시나리오→진행→오류시 수정·재시험→결과작성 / scenario→run→fix&retest→result"

makefile_targets:
  dev: "dotnet run --project src/Api"
  test: "dotnet test"
  build: "docker compose build"
  deploy: "helm upgrade / argocd sync"

references:
  - "Microsoft .NET 8 LTS, ASP.NET Core Web API, EF Core 8 (Npgsql)"
