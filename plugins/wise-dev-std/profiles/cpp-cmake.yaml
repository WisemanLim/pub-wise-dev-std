id: cpp-cmake
title: "C/C++ (CMake + vcpkg)"
status: stable
summary: >
  극한 성능·하드웨어 밀착 계층의 표준. CMake 빌드 + vcpkg 의존성 + Drogon HTTP.
  OS/드라이버·임베디드·HFT·게임엔진·AI 프레임워크 코어 등 다른 언어로
  대체가 불가능하거나 비효율적인 영역을 커버.
when_to_use:
  - "나노초~마이크로초 응답속도가 필요한 HFT·저지연 트레이딩 시스템"
  - "OS 커널·디바이스 드라이버·펌웨어·임베디드(MCU/RTOS)"
  - "게임 엔진, 렌더링 파이프라인, 실시간 그래픽스"
  - "C/C++ 기반 레거시 코드베이스(DB 엔진·브라우저·AI 프레임워크) 확장"
  - "CUDA/ROCm 커널·BLAS/cuDNN 연동 고성능 연산 레이어"
  - "ROS2 노드, ADAS/자율주행 모듈, MISRA-C 안전 표준 요구 시스템"
avoid_when:
  - "빠른 프로토타이핑·ML 실험·데이터 분석 → python-fastapi"
  - "팀 C++ 숙련도 부족 + 일정 촉박 → go-gin 또는 rust-axum 검토"
  - "메모리 안전성을 컴파일러가 보장해야 할 때 → rust-axum"
  - "풀스택 웹·BFF → node-next-nest"

languages:
  primary: c-cpp
  also: [cmake]

package_managers:
  default: vcpkg
  allowed: [vcpkg, conan]
  notes: >
    vcpkg: CMake toolchain 통합, manifest 모드(vcpkg.json). VCPKG_ROOT 환경변수 필요.
    Conan: CI 레이어 캐시 친화적, 대형 팀에서 선호. CMakePresets.json 과 함께 사용.

layers:
  frontend: null
  backend:
    framework: "Drogon (HTTP/WebSocket, async coroutine, 대안: cpp-httplib·Crow·Pistache)"
    orm: "SQLiteCpp(local) / libpq(postgres) / Drogon 내장 ORM (대안: soci)"
    runtime: "네이티브 OS 스레드 + Drogon trantor 이벤트루프"
  database:
    default: postgres
    local: sqlite
    cache: redis
  ops:
    ci: "GitHub Actions (ubuntu-latest + clang/gcc matrix)"
    container: "Docker (multi-stage: ubuntu:24.04 build → debian:bookworm-slim runtime) + Docker Compose"
    deploy: "Kubernetes + Helm + Argo CD"
    quality: "clang-format + clang-tidy + ctest + AddressSanitizer/UBSan"
  app: null

run_methods:
  direct:
    dev: "./build/debug/{{PROJECT_NAME}} (make build 후 — 컴파일 선행 필수)"
    start: "./build/release/{{PROJECT_NAME}}"
    local_pm: >
      goreman (Procfile.dev) — make run(build 포함)/stop/logs/ps.
      cargo-watch 같은 핫리로드는 없음(재컴파일 후 재시작). 대안: entr, nodemon --exec.
  container:
    dev: "docker compose --profile app up"

environments:
  local:   { db: sqlite,   compose: false, notes: "CMake Debug 빌드 + SQLite 파일 DB" }
  dev:     { db: postgres, compose: true,  notes: "compose: postgres+redis, Release 빌드" }
  staging: { db: postgres, compose: true,  notes: "RelWithDebInfo 빌드 검증" }
  prod:    { db: postgres, compose: false, notes: "K8s, distroless/slim 이미지, LTO 최적화" }

scaffold:
  tree:
    - "src/"
    - "src/handlers/"
    - "src/services/"
    - "src/models/"
    - "include/{{PROJECT_NAME}}/"
    - "tests/"
    - "tests/unit/"
    - "docker/"
    - ".github/workflows/"
  files:
    - "Makefile"
    - "CMakeLists.txt"
    - "CMakePresets.json"
    - "vcpkg.json"
    - "Procfile.dev"
    - "docker-compose.yml"
    - "Dockerfile"
    - "src/main.cpp"
    - ".env.local"
    - ".clang-format"
    - ".github/workflows/ci.yml"

testing:
  framework: "GTest + GMock (via vcpkg: gtest)"
  dir: "test/"
  dev_env: "test/dev-env/"
  impl: "test/impl/<Nth>/"
  cycle: "시나리오→빌드·진행→오류시 수정·재시험→결과작성 / scenario→build·run→fix&retest→result"

makefile_targets:
  configure: "cmake --preset debug (CMakePresets.json, compile_commands.json 생성)"
  build: "cmake --build build/debug --parallel (configure 자동 선행)"
  test: "ctest --test-dir build/debug --output-on-failure --parallel"
  sanitize: "AddressSanitizer + UBSan 빌드·실행 (메모리/UB 안전성 점검)"
  fmt: "clang-format -i (src/ + include/ 전체)"
  lint: "clang-tidy 정적 분석 (compile_commands.json 기반)"
  deploy: "helm upgrade --install / argocd sync"

references:
  - "C/C++ 필수 도메인: HFT·임베디드·OS·게임엔진·AI 프레임워크 코어·ROS2·ADAS"
  - "CMake best practices: CMakePresets.json + vcpkg manifest mode (VCPKG_ROOT)"
  - "Drogon: https://drogon.org — C++ 고성능 비동기 HTTP 프레임워크"
